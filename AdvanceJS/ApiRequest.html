<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Request Handling using Ajax</title>
</head>
<body style="background-color: #212121; color: #fff;">
    
</body>
<script>
    const requestUrl = 'https://api.github.com/users/Raghav11464'
    const xhr = new XMLHttpRequest();
    xhr.open('GET', requestUrl);
    // open() method has been invoked. During this state, the request headers can be set using the setRequestHeader() method and the send() method can be called which will initiate the fetch

    xhr.onreadystatechange = function() {
        console.log(xhr.readyState);
        //whenever state changes, this function is invoked on its own 
        if(xhr.readyState === 4) {
            // when the state is 4, client is in DONE state that means operation is complete 
            const data = JSON.parse(this.responseText)
            //responseText is string type, not an object
            //so we have to convert this string to an objext using JSON.parse() method 
            console.log(data.name);
        }
    }

    xhr.send()   

</script>
</html>/
