<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Chai aur Code</h1>
    <button id="stop">Stop</button>
</body>
<script>
    //Method 1
    setTimeout(function() {
        // console.log("Raghav Sharan Mishra");
    }, 2000)

    const sayRaghav = function() {
        console.log("Hello Raghav!!");
    }
    // setTimeout(sayRaghav,2000)
    
    const changeText = function() {
        document.querySelector('h1').innerHTML = "Raghav Sharan Mishra"
    }
    // setTimeout(changeText, 2000)
    //here we are passing a functional expression var as the callback function to setTimeout
    const changeMe = setTimeout(changeText, 2000)

    // clearTimeout(changeMe)//this needs reference, that means which timeout is to cleared 

    document.querySelector('#stop').addEventListener('click', function() {
        clearTimeout(changeMe)
        console.log("STOPPED");
    })
    //as soon as i click the button, within the specified time in ms in setTimeout, our text will not change as we used clearTimeout in the event listner 

    

</script>
</html>
